name: Autonomous Repository Analysis and Docs

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:

jobs:
  auto-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Analyze Repository
      run: python scripts/analyze_repo.py

    - name: Generate Diagrams
      run: python scripts/generate_diagrams.py

    - name: Update README
      run: python scripts/update_readme.py

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "docs(auto): Update repository architecture and README [skip ci]"
        file_pattern: "README.md knowledge_graph.json diagrams/*"
        branch: main
