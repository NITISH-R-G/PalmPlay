<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Architecture Diagram</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f4f4f9; font-family: sans-serif; }
        .node circle { stroke: #fff; stroke-width: 1.5px; }
        .node text { pointer-events: none; font-size: 12px; }
        .link { stroke: #999; stroke-opacity: 0.6; }
    </style>
</head>
<body>
    <div id="graph"></div>
    <script>
        const graphData = {"nodes": [{"id": "app.py", "group": 2, "label": "app.py"}, {"id": "gesture_spotify_player.py", "group": 2, "label": "gesture_spotify_player.py"}, {"id": "check_env.py", "group": 2, "label": "check_env.py"}, {"id": "test_tasks_api.py", "group": 2, "label": "test_tasks_api.py"}, {"id": "generate_tone.py", "group": 2, "label": "generate_tone.py"}, {"id": "debug_mp.py", "group": 2, "label": "debug_mp.py"}, {"id": "server.py", "group": 2, "label": "server.py"}, {"id": "Client", "group": 3, "label": "API Client"}], "links": [{"source": "Client", "target": "server.py", "value": 2}]};

        const width = window.innerWidth;
        const height = window.innerHeight;

        const color = d3.scaleOrdinal(d3.schemeCategory10);

        const svg = d3.select("#graph").append("svg")
            .attr("width", width)
            .attr("height", height)
            .call(d3.zoom().on("zoom", (event) => {
               svg.attr("transform", event.transform);
            }))
            .append("g");

        const simulation = d3.forceSimulation()
            .force("link", d3.forceLink().id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2));

        const link = svg.append("g")
            .attr("class", "links")
            .selectAll("line")
            .data(graphData.links)
            .enter().append("line")
            .attr("class", "link")
            .attr("stroke-width", d => Math.sqrt(d.value));

        const node = svg.append("g")
            .attr("class", "nodes")
            .selectAll("g")
            .data(graphData.nodes)
            .enter().append("g")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        node.append("circle")
            .attr("r", 10)
            .attr("fill", d => color(d.group));

        node.append("text")
            .attr("dx", 12)
            .attr("dy", ".35em")
            .text(d => d.label);

        // Click interaction for deep linking
        node.on("click", (event, d) => {
            if(d.group === 2) {
                // Try to open the file in the repo (assuming standard GitHub format if hosted)
                console.log("Clicked file:", d.id);
                // window.open("https://github.com/user/repo/blob/main/" + d.id, "_blank");
            }
        });

        simulation
            .nodes(graphData.nodes)
            .on("tick", ticked);

        simulation.force("link")
            .links(graphData.links);

        function ticked() {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        }

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
    </script>
</body>
</html>
